<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3454d1"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6072"/>
    </marker>
    <marker id="arrowDotted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0b4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1340" height="900" fill="#f7f8fc"/>

  <!-- Title -->
  <text x="30" y="38" font-size="21" font-weight="800" fill="#1b1f2e">CXOS Microservices Architecture — Service Flow &amp; Consumption</text>
  <text x="30" y="60" font-size="12.5" fill="#5a6072">Every Cxos.*.Api service from the Full Application Service Map, how data flows between them, and how each is consumed.</text>

  <!-- Legend -->
  <g transform="translate(870,26)">
    <line x1="0" y1="4" x2="30" y2="4" stroke="#3454d1" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
    <text x="38" y="8" font-size="11" fill="#1b1f2e">Real-time flow (command)</text>
    <line x1="0" y1="24" x2="30" y2="24" stroke="#5a6072" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
    <text x="38" y="28" font-size="11" fill="#1b1f2e">Batch / query flow</text>
    <line x1="0" y1="44" x2="30" y2="44" stroke="#9aa0b4" stroke-width="1.75" stroke-dasharray="1.5,4" marker-end="url(#arrowDotted)"/>
    <text x="38" y="48" font-size="11" fill="#1b1f2e">Signal / cross-cutting</text>
  </g>

  <!-- ===================== Cross-cutting band background ===================== -->
  <rect x="0" y="680" width="1340" height="200" fill="#eef0f8"/>
  <text x="30" y="706" font-size="12" font-weight="800" fill="#3454d1">HORIZONTALS &#8212; run underneath every Cxos.*.Api service above</text>

  <!-- Connector lines from spine down into the horizontal band -->
  <line x1="285" y1="424" x2="285" y2="760" stroke="#9aa0b4" stroke-width="1.5" stroke-dasharray="1.5,4" marker-end="url(#arrowDotted)"/>
  <line x1="665" y1="424" x2="665" y2="760" stroke="#9aa0b4" stroke-width="1.5" stroke-dasharray="1.5,4" marker-end="url(#arrowDotted)"/>
  <line x1="1045" y1="424" x2="1045" y2="760" stroke="#9aa0b4" stroke-width="1.5" stroke-dasharray="1.5,4" marker-end="url(#arrowDotted)"/>

  <!-- ===================== Main flow arrows ===================== -->
  <!-- Inbound Connectors -> Ingestion -->
  <line x1="170" y1="392" x2="205" y2="392" stroke="#3454d1" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <text x="187" y="384" font-size="9.5" text-anchor="middle" fill="#5a6072">publishes</text>

  <!-- Ingestion -> Event Processing -->
  <line x1="360" y1="392" x2="395" y2="392" stroke="#3454d1" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <text x="377" y="384" font-size="9.5" text-anchor="middle" fill="#5a6072">Event Hubs</text>

  <!-- Event Processing <-> Schema Governance -->
  <line x1="475" y1="424" x2="475" y2="465" stroke="#5a6072" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)" marker-start="url(#arrowDashed)"/>
  <text x="530" y="450" font-size="9.5" fill="#5a6072">validates</text>

  <!-- Event Processing -> Data Foundation -->
  <line x1="550" y1="392" x2="585" y2="392" stroke="#3454d1" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <text x="567" y="384" font-size="9.5" text-anchor="middle" fill="#5a6072">writes</text>

  <!-- Data Foundation -> Analytics & AI Insights -->
  <line x1="740" y1="392" x2="775" y2="392" stroke="#5a6072" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <text x="757" y="384" font-size="9.5" text-anchor="middle" fill="#5a6072">reads</text>

  <!-- Data Foundation -> Customer Profile (diagonal) -->
  <line x1="720" y1="365" x2="778" y2="255" stroke="#5a6072" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>

  <!-- Analytics & AI Insights <-> Customer Profile (writes back) -->
  <line x1="855" y1="360" x2="855" y2="278" stroke="#9aa0b4" stroke-width="1.5" stroke-dasharray="1.5,4" marker-end="url(#arrowDotted)"/>
  <text x="862" y="320" font-size="9" fill="#5a6072">propensity /</text>
  <text x="862" y="331" font-size="9" fill="#5a6072">anomaly writes</text>

  <!-- Analytics & AI Insights -> Operational Services (signals) -->
  <line x1="855" y1="424" x2="855" y2="506" stroke="#9aa0b4" stroke-width="1.5" stroke-dasharray="1.5,4" marker-end="url(#arrowDotted)"/>
  <text x="862" y="470" font-size="9" fill="#5a6072">quality / anomaly</text>
  <text x="862" y="481" font-size="9" fill="#5a6072">signals</text>

  <!-- Customer Profile -> Activation (diagonal) -->
  <line x1="928" y1="255" x2="978" y2="365" stroke="#3454d1" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

  <!-- Analytics & AI Insights -> Activation -->
  <line x1="930" y1="392" x2="965" y2="392" stroke="#3454d1" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <text x="947" y="384" font-size="9.5" text-anchor="middle" fill="#5a6072">segments</text>

  <!-- Activation -> Outbound Connectors -->
  <line x1="1120" y1="392" x2="1155" y2="392" stroke="#3454d1" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <text x="1137" y="384" font-size="9.5" text-anchor="middle" fill="#5a6072">dispatches</text>

  <!-- ===================== Main-lane boxes ===================== -->
  <!-- Inbound Connectors -->
  <g>
    <rect x="20" y="360" width="150" height="64" rx="10" fill="#f3effc" stroke="#6a4fc2" stroke-width="2"/>
    <text x="95" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#128229; Inbound Connectors</text>
    <text x="95" y="400" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Connectors.* (in)</text>
    <text x="95" y="413" text-anchor="middle" font-size="8" fill="#5a6072">Salesforce · Shopify · +6 more</text>
  </g>

  <!-- Ingestion -->
  <g>
    <rect x="210" y="360" width="150" height="64" rx="10" fill="#e9f1fc" stroke="#2b7fd6" stroke-width="2"/>
    <text x="285" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#128229; Ingestion</text>
    <text x="285" y="403" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Ingestion.Api</text>
  </g>

  <!-- Event Processing -->
  <g>
    <rect x="400" y="360" width="150" height="64" rx="10" fill="#e5f4f2" stroke="#0f9b8e" stroke-width="2"/>
    <text x="475" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#9881;&#65039; Event Processing</text>
    <text x="475" y="403" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Processing.Api</text>
  </g>

  <!-- Schema Governance -->
  <g>
    <rect x="400" y="470" width="150" height="64" rx="10" fill="#e5f4f2" stroke="#0f9b8e" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="475" y="493" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f2e">&#128203; Schema Governance</text>
    <text x="475" y="509" text-anchor="middle" font-size="8.5" font-family="Consolas, monospace" fill="#5a6072">...SchemaGovernance.Api</text>
    <text x="475" y="522" text-anchor="middle" font-size="8" fill="#5a6072">Supporting Subdomain</text>
  </g>

  <!-- Data Foundation & Governance -->
  <g>
    <rect x="590" y="360" width="150" height="64" rx="10" fill="#e8f5ec" stroke="#2e9e5b" stroke-width="2"/>
    <text x="665" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#127963;&#65039; Data Foundation</text>
    <text x="665" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&amp; Governance</text>
    <text x="665" y="413" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Foundation.Api</text>
  </g>

  <!-- Customer Profile (Core Domain) -->
  <g>
    <rect x="780" y="210" width="150" height="64" rx="10" fill="#fbf0e3" stroke="#d9822b" stroke-width="3"/>
    <text x="855" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#129380; Customer Profile</text>
    <text x="855" y="251" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Profile.Api</text>
    <text x="855" y="264" text-anchor="middle" font-size="8" font-weight="700" fill="#d9822b">CORE DOMAIN</text>
  </g>

  <!-- Analytics & AI Insights -->
  <g>
    <rect x="780" y="360" width="150" height="64" rx="10" fill="#fbf0e3" stroke="#d9822b" stroke-width="2"/>
    <text x="855" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#129504; Analytics &amp;</text>
    <text x="855" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">AI Insights</text>
    <text x="855" y="413" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Intelligence.Api</text>
  </g>

  <!-- Operational Services -->
  <g>
    <rect x="780" y="510" width="150" height="64" rx="10" fill="#fbf0e3" stroke="#d9822b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="855" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#128736; Operational</text>
    <text x="855" y="549" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">Services</text>
    <text x="855" y="564" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Operations.Api</text>
  </g>

  <!-- Activation (Core Domain) -->
  <g>
    <rect x="970" y="360" width="150" height="64" rx="10" fill="#fbe9ef" stroke="#c23b6d" stroke-width="3"/>
    <text x="1045" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#128225; Activation</text>
    <text x="1045" y="402" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Activation.Api</text>
    <text x="1045" y="415" text-anchor="middle" font-size="8" font-weight="700" fill="#c23b6d">CORE DOMAIN</text>
  </g>

  <!-- Outbound Connectors -->
  <g>
    <rect x="1160" y="360" width="150" height="64" rx="10" fill="#fbe9ef" stroke="#c23b6d" stroke-width="2"/>
    <text x="1235" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1f2e">&#128225; Outbound Connectors</text>
    <text x="1235" y="400" text-anchor="middle" font-size="9" font-family="Consolas, monospace" fill="#5a6072">Cxos.Connectors.* (out)</text>
    <text x="1235" y="413" text-anchor="middle" font-size="8" fill="#5a6072">SendGrid · Twilio · +2 more</text>
  </g>

  <!-- ===================== Horizontal band boxes ===================== -->
  <g>
    <rect x="20" y="760" width="150" height="64" rx="10" fill="#e6eafb" stroke="#3454d1" stroke-width="2"/>
    <text x="95" y="784" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f2e">&#128200; Observability</text>
    <text x="95" y="800" text-anchor="middle" font-size="8.5" font-family="Consolas, monospace" fill="#5a6072">Cxos.Observability.Api</text>
  </g>
  <g>
    <rect x="307" y="760" width="150" height="64" rx="10" fill="#e6eafb" stroke="#3454d1" stroke-width="2"/>
    <text x="382" y="784" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f2e">&#128272; Security</text>
    <text x="382" y="800" text-anchor="middle" font-size="8.5" font-family="Consolas, monospace" fill="#5a6072">Cxos.Security.Api</text>
  </g>
  <g>
    <rect x="594" y="760" width="150" height="64" rx="10" fill="#e6eafb" stroke="#3454d1" stroke-width="2"/>
    <text x="669" y="781" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f2e">&#128736; Developer</text>
    <text x="669" y="795" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f2e">Platform</text>
    <text x="669" y="810" text-anchor="middle" font-size="8.5" font-family="Consolas, monospace" fill="#5a6072">Cxos.DevPlatform.Api</text>
  </g>
  <g>
    <rect x="881" y="760" width="150" height="64" rx="10" fill="#e6eafb" stroke="#3454d1" stroke-width="2"/>
    <text x="956" y="784" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f2e">&#127961;&#65039; Multi-Tenancy</text>
    <text x="956" y="800" text-anchor="middle" font-size="8.5" font-family="Consolas, monospace" fill="#5a6072">Cxos.Tenancy.Api</text>
  </g>
  <g>
    <rect x="1168" y="760" width="150" height="64" rx="10" fill="#e6eafb" stroke="#3454d1" stroke-width="2"/>
    <text x="1243" y="784" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f2e">&#9881;&#65039; Administration</text>
    <text x="1243" y="800" text-anchor="middle" font-size="8.5" font-family="Consolas, monospace" fill="#5a6072">Cxos.Admin.Api</text>
  </g>

  <!-- Footer note -->
  <text x="30" y="860" font-size="10.5" fill="#5a6072">Generic Subdomain connectors (Inbound/Outbound) are stateless adapters — see Platform Connectors on each module page for the full named list.</text>
  <text x="30" y="876" font-size="10.5" fill="#5a6072">Core Domain services (thicker border): Customer Profile &amp; Activation. Full namespace/database/DDD-layer detail: click any card in the Full Application Service Map, or see the BRD.</text>
</svg>
